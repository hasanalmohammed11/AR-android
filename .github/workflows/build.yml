name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use real google-services.json (if secret exists)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" > app/google-services.json; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Install clean Android SDK 27
        run: |
          SDK=$HOME/android-sdk
          mkdir -p $SDK
          export JAVA_HOME="$JAVA_HOME_17_X64"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SM --sdk_root=$SDK --licenses > /dev/null || true
          $SM --sdk_root=$SDK "platform-tools" "platforms;android-27" "build-tools;27.0.3"
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
        env:
          SKIP_JDK_VERSION_CHECK: "1"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 4.4

      - name: Build
        run: gradle assembleProductionDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/production/debug/*.apk
